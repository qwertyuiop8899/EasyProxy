services:
  easyproxy:
    image: ghcr.io/realbestia1/easyproxy:latest
    container_name: easyproxy
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      #- API_PASSWORD=
      - PORT=7860
      - SIDECAR_INTERNAL_PORT=${SIDECAR_INTERNAL_PORT:-0}
      - SIDECAR_STARTUP_TIMEOUT=${SIDECAR_STARTUP_TIMEOUT:-20}
      - SIDECAR_CACHE_DIR=${SIDECAR_CACHE_DIR:-/data/recordings/sidecar_data}
      - SIDECAR_PUBLIC_URL=${SIDECAR_PUBLIC_URL:-}
      - SIDECAR_FIXED_TOKEN=${SIDECAR_FIXED_TOKEN:-}
      - SIDECAR_BOOTSTRAP_KEY=${SIDECAR_BOOTSTRAP_KEY:-}
      - SIDECAR_AUDIO_PROXY=${SIDECAR_AUDIO_PROXY:-}
      - OFFSET_API_URL=${OFFSET_API_URL:-}
      - OFFSET_API_TOKEN=${OFFSET_API_TOKEN:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      - ./data:/data
